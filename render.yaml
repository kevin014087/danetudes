services:
  - type: web
    name: danetudes-static
    runtime: static
    buildCommand: echo "Static site ready"
    staticPublishPath: ./
    autoDeploy: true
    routes:
      - path: /
        destination: /index.html
      - path: /*.html
        destination: /$path
      - path: /assets/*
        destination: /assets/$path
